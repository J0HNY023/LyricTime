<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Per-Word Dust Dissolve Animation with Speech Recognition</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>" type="image/svg+xml">

  <link rel="stylesheet" href="css/Lstyle.css">
</head>
<body>

  <!-- Main Content Area (Left Side) -->
  <div class="main-content">

    <!-- Canvas Area (Takes all available space) -->
    <div class="canvas-area">
      <div class="canvas-viewport" role="application" aria-label="Animation canvas area">
        <canvas id="animCanvas" role="img" aria-label="Word animation display canvas"></canvas>

        <!-- Transcription Progress Overlay -->
        <div id="progressOverlay" class="progress-overlay">
          <div id="progressTitle" class="progress-title">Uploading Audio...</div>
          <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
          </div>
          <div id="progressText" class="progress-text">0%</div>
        </div>
      </div>

      <!-- Audio Timeline Player Bar (Moved outside canvas viewport) -->
      <div id="audioControls" class="audio-controls-bar">
        <button id="playPauseBtn" class="audio-btn">▶</button>
        <button id="loopBtn" class="audio-btn" title="Toggle Loop" style="font-size:0.75rem;">🔁</button>
        <button id="fullscreenBtn" class="audio-btn" title="Toggle Fullscreen" style="font-size:0.85rem;">⛶</button>
        
        <!-- Undo/Redo Buttons -->
        <button id="undoBtn" class="audio-btn" title="Undo (Ctrl+Z)" style="font-size:0.75rem;">↶</button>
        <button id="redoBtn" class="audio-btn" title="Redo (Ctrl+Y)" style="font-size:0.75rem;">↷</button>

        <!-- Skip Back/Forward Buttons -->
        <button id="skipBackBtn" class="audio-btn" title="Skip Backward" style="font-size:0.75rem;">◀</button>
        <button id="skipForwardBtn" class="audio-btn" title="Skip Forward" style="font-size:0.75rem;">▶</button>

        <div style="display:flex; align-items:center; gap:4px; margin-right:10px;">
          <span style="font-size:0.75rem; color:#8a8a98;" id="scrubLabel">Scrub:</span>
          <input type="number" id="scrubValInput" name="scrubValInput" value="5" min="1" style="width:45px; padding:2px 4px; font-size:0.75rem;" aria-labelledby="scrubLabel">
          <select id="scrubUnitSelect" name="scrubUnitSelect" style="padding:2px 4px; font-size:0.75rem; background:#181820; color:#fff; border:1px solid #333; border-radius:3px;" aria-label="Scrub time unit">
            <option value="s">s</option>
            <option value="ms">ms</option>
          </select>
        </div>

        <input type="range" id="timelineSlider" class="timeline-slider" name="timelineSlider" min="0" max="100" value="0" step="0.1" aria-labelledby="scrubLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span id="timeDisplay" class="time-display" aria-live="polite" aria-label="Current time and duration">0:00 / 0:00</span>
      </div>
    </div>

    <!-- Bottom Timestamp Editor (Collapsible) -->
    <div id="timestampEditorContainer" class="bottom-editor collapsed">
      <div class="editor-header" onclick="toggleEditor()">
        <div style="display:flex; align-items:center; gap:12px; flex:1;">
          <span class="editor-title">SYNCED WORDS & POSITIONS</span>
          <button onclick="downloadTimestamps(); event.stopPropagation();" title="Download timestamps as JSON file" style="background:#0e3a2a; color:#00ffcc; border:1px solid #2a5a3a; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:0.7rem; white-space:nowrap;">⬇ Download</button>
        </div>
        <button class="toggle-btn" id="editorToggleBtn">▲ Expand</button>
      </div>
      <div class="editor-content">
        <!-- Content injected via JS -->
      </div>
    </div>

  </div>



  <!--
    Script load order matters: these are plain (non-module) scripts sharing
    one global scope, so a file may only reference globals declared in a
    file that loaded *before* it (functions attached to event listeners are
    the exception — they just need to exist by the time the event fires).
    
    Load order: config → state → utils → error-boundary → modules → main
  -->
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/error-boundary.js"></script>
  <script src="js/layouts.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/text-effects.js"></script>
  <script src="js/word-manager.js"></script>
  <script src="js/timestamp-editor.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui-handlers.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
